name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.2.0 or a commit SHA
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, language/runtime version, and anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
